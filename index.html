<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>קופת משמרת</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;800&family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1c2b28;
    --parchment:#f6f1e6;
    --parchment-2:#eee6d3;
    --amber:#c1893c;
    --amber-deep:#9c6b27;
    --brick:#a85846;
    --sage:#5f7a5b;
    --line:#d9cfb8;
    --muted:#6b7369;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ink);
    font-family:'Heebo',sans-serif;
    color:var(--ink);
    min-height:100vh;
    padding:0;
  }
  .wrap{
    max-width:720px;
    margin:0 auto;
    background:var(--parchment);
    min-height:100vh;
    box-shadow:0 0 60px rgba(0,0,0,.35);
  }
  header{
    padding:28px 24px 20px;
    border-bottom:1px solid var(--line);
  }
  .eyebrow{
    font-size:13px;
    color:var(--muted);
    margin:0 0 4px;
  }
  h1{
    font-family:'Rubik',sans-serif;
    font-weight:800;
    font-size:26px;
    margin:0;
    color:var(--ink);
  }
  .year-toggle{
    display:flex;
    gap:8px;
    margin-top:16px;
  }
  .year-btn{
    font-family:'Heebo',sans-serif;
    font-size:14px;
    padding:7px 16px;
    border-radius:999px;
    border:1px solid var(--line);
    background:transparent;
    color:var(--muted);
    cursor:pointer;
  }
  .year-btn.active{
    background:var(--ink);
    color:var(--parchment);
    border-color:var(--ink);
  }

  .balance-card{
    margin:20px 24px;
    padding:24px;
    background:var(--ink);
    border-radius:14px;
    color:var(--parchment);
    position:relative;
    overflow:hidden;
  }
  .balance-label{
    font-size:14px;
    color:#b9c2ba;
    margin:0 0 6px;
  }
  .balance-number{
    font-family:'Rubik',sans-serif;
    font-weight:800;
    font-size:44px;
    margin:0;
    letter-spacing:-1px;
  }
  .balance-sub{
    display:flex;
    gap:18px;
    margin-top:16px;
    font-size:13px;
    color:#c9d1c9;
  }
  .balance-sub span b{
    color:var(--parchment);
    font-weight:600;
  }

  .section-title{
    font-family:'Rubik',sans-serif;
    font-weight:600;
    font-size:16px;
    margin:28px 24px 10px;
    color:var(--ink);
  }

  .table-wrap{
    margin:0 24px 24px;
    border:1px solid var(--line);
    border-radius:10px;
    overflow:hidden;
    background:#fffdf8;
  }
  table{
    border-collapse:collapse;
    width:100%;
    font-size:13px;
  }
  th, td{
    padding:8px 10px;
    text-align:center;
    white-space:nowrap;
    border-bottom:1px solid var(--line);
  }
  th{
    background:var(--parchment-2);
    font-weight:500;
    color:var(--muted);
    font-size:12px;
    position:sticky;
    top:0;
  }
  td.cat{
    text-align:right;
    font-weight:500;
    color:var(--ink);
    position:sticky;
    right:0;
    background:#fffdf8;
    border-left:1px solid var(--line);
  }
  tr.total-row td{
    font-weight:700;
    background:var(--parchment-2);
  }
  td.zero{ color:#cfc6ac; }
  .scroll-x{ overflow-x:auto; }

  footer{
    padding:18px 24px 32px;
    font-size:12px;
    color:var(--muted);
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .refresh-btn{
    font-family:'Heebo',sans-serif;
    font-size:12px;
    padding:6px 14px;
    border-radius:999px;
    border:1px solid var(--line);
    background:transparent;
    color:var(--ink);
    cursor:pointer;
  }
  .status{
    padding:14px 24px;
    font-size:13px;
    color:var(--brick);
  }
  .loading{
    padding:60px 24px;
    text-align:center;
    color:var(--muted);
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">קופה משותפת</p>
    <h1>קופת משמרת</h1>
    <div class="year-toggle" id="yearToggle"></div>
  </header>

  <div id="content">
    <div class="loading">טוען נתונים מהגיליון…</div>
  </div>

  <footer>
    <span id="lastUpdated"></span>
    <button class="refresh-btn" onclick="loadAll()">רענון</button>
  </footer>
</div>

<script>
const SHEET_ID = "15vEZQ95PcQQZcByWzJjg4aazwl8Rc6j3mBFPI7urKlY";
const YEARS = ["2026", "2025"];
const MONTHS = ["ינואר","פברואר","מרץ","אפריל","מאי","יוני","יולי","אוגוסט","ספטמבר","אוקטובר","נובמבר","דצמבר"];
let currentYear = "2026";
let cache = {};

function gvizUrl(sheetName){
  return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(sheetName)}`;
}

async function fetchSheet(sheetName){
  const res = await fetch(gvizUrl(sheetName));
  const text = await res.text();
  const jsonStr = text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1);
  const data = JSON.parse(jsonStr);
  if (data.status === 'error'){
    const msg = (data.errors && data.errors[0] && data.errors[0].detailed_message) || 'שגיאה מהגיליון';
    throw new Error(sheetName + ': ' + msg);
  }
  return data.table.rows.map(r => (r.c || []).map(c => c ? (c.v !== undefined ? c.v : null) : null));
}

function num(v){
  const n = parseFloat(v);
  return isNaN(n) ? 0 : n;
}

function parseYearSheet(rows){
  // category rows: col idx1 = name, idx2..13 = 12 months
  // totals row: idx1 empty, idx2 numeric, idx15 = grand total
  const categories = [];
  let totals = null;
  let grandTotal = 0;
  for (const row of rows){
    const name = row[1];
    const monthVals = row.slice(2, 14);
    const hasMonthData = monthVals.some(v => v !== null && v !== "" );
    if (!name && hasMonthData && monthVals.every(v => v === null || !isNaN(parseFloat(v)))){
      totals = monthVals.map(num);
      grandTotal = num(row[15]);
      continue;
    }
    if (name && typeof name === 'string' && name.trim() && !name.includes('סה"כ') && hasMonthData){
      categories.push({ name: name.trim(), values: monthVals.map(num) });
    }
  }
  // opening balance: row where idx5 contains 'תחילת שנה'
  let opening = 0;
  for (const row of rows){
    if (row[5] && String(row[5]).includes('תחילת שנה')){
      opening = num(row[6]);
      break;
    }
  }
  return { categories, totals: totals || Array(12).fill(0), grandTotal, opening };
}

function parseIncomeSheet(rows, year){
  const colIdx = year === "2026" ? 7 : 8;
  let total = 0;
  for (const row of rows){
    const label = row[9];
    if (label && String(label).includes('סה"כ')){
      total = num(row[colIdx]);
      break;
    }
  }
  return total;
}

async function loadAll(){
  document.getElementById('content').innerHTML = '<div class="loading">טוען נתונים מהגיליון…</div>';
  try {
    const [yearRows, incomeRows] = await Promise.all([
      fetchSheet(currentYear),
      fetchSheet('גיליון2')
    ]);
    const yearData = parseYearSheet(yearRows);
    const income = parseIncomeSheet(incomeRows, currentYear);
    cache[currentYear] = { yearData, income };
    render();
    document.getElementById('lastUpdated').textContent =
      'עודכן ' + new Date().toLocaleString('he-IL', { hour:'2-digit', minute:'2-digit', day:'2-digit', month:'2-digit' });
  } catch (e){
    document.getElementById('content').innerHTML =
      '<div class="status">לא הצלחתי לטעון את הנתונים מהגיליון. ודא שהגיליון משותף כ"כל בעל הקישור – צפייה".<br><span style="font-size:11px;opacity:.7;">פרטי שגיאה: ' + (e && e.message ? e.message : e) + '</span></div>';
  }
}

function render(){
  const { yearData, income } = cache[currentYear];
  const balance = income - yearData.grandTotal;

  let html = `
    <div class="balance-card">
      <p class="balance-label">יתרת קופה — ${currentYear}</p>
      <p class="balance-number">${balance.toLocaleString('he-IL')} ₪</p>
      <div class="balance-sub">
        <span>הכנסות: <b>${income.toLocaleString('he-IL')} ₪</b></span>
        <span>הוצאות: <b>${yearData.grandTotal.toLocaleString('he-IL')} ₪</b></span>
        <span>יתרת פתיחה: <b>${yearData.opening.toLocaleString('he-IL')} ₪</b></span>
      </div>
    </div>
    <p class="section-title">הוצאות לפי קטגוריה וחודש</p>
    <div class="table-wrap scroll-x">
      <table>
        <thead><tr><th>קטגוריה</th>`;
  for (const m of MONTHS) html += `<th>${m}</th>`;
  html += `<th>סה"כ</th></tr></thead><tbody>`;

  for (const cat of yearData.categories){
    const rowTotal = cat.values.reduce((a,b)=>a+b,0);
    if (rowTotal === 0) continue;
    html += `<tr><td class="cat">${cat.name}</td>`;
    for (const v of cat.values){
      html += `<td class="${v===0?'zero':''}">${v ? v.toLocaleString('he-IL') : '—'}</td>`;
    }
    html += `<td><b>${rowTotal.toLocaleString('he-IL')}</b></td></tr>`;
  }

  html += `<tr class="total-row"><td class="cat">סה"כ חודשי</td>`;
  for (const v of yearData.totals){
    html += `<td>${v ? v.toLocaleString('he-IL') : '—'}</td>`;
  }
  html += `<td>${yearData.grandTotal.toLocaleString('he-IL')}</td></tr>`;
  html += `</tbody></table></div>`;

  document.getElementById('content').innerHTML = html;
}

function buildYearToggle(){
  const el = document.getElementById('yearToggle');
  el.innerHTML = YEARS.map(y =>
    `<button class="year-btn ${y===currentYear?'active':''}" onclick="switchYear('${y}')">${y}</button>`
  ).join('');
}

function switchYear(y){
  currentYear = y;
  buildYearToggle();
  if (cache[y]) render(); else loadAll();
}

buildYearToggle();
loadAll();
</script>
</body>
</html>
